<div class="profile-layout" *ngIf="userInfo">
  <aside class="profile-sidebar">
    <h3>Account settings</h3>
    <ul>
      <li class="active">Profile settings</li>
      <!-- <li>Password</li>
      <li>Notifications</li>
      <li>Verification</li> -->
    </ul>
  </aside>

  <main class="profile-content">

    <div class="profile-card">

      <div class="avatar-section">
        <img [src]="userInfo.avatar || 'https://i.pravatar.cc/150?img=12'" class="avatar" />
        <div class="avatar-buttons">
          <button *ngIf="isCurrentUserProfile()" class="edit-btn" (click)="showEditProfileModal = true">
            Edit Profile
          </button>
          
          <button *ngIf="!isCurrentUserProfile()" 
          class="follow-btn" 
          (click)="toggleFollow()">
          {{ isFollowingUser ? 'Unfollow' : 'Follow' }}
        </button>
        
        <button *ngIf="!isCurrentUserProfile()" 
        class="report-btn" 
        (click)="showReportUserModal = true">
        Report User
      </button>
    </div>
  </div>
  <p class="bio">{{ userInfo?.bio }}</p>
  
      <div class="info-grid">
        <div>
          <label>Name</label>
          <input type="text" [value]="userInfo.name" disabled />
        </div>

        <!-- <div class="bio">
          <label>Bio</label>
          <textarea [value]="userInfo.bio" rows="3" disabled></textarea>
      </div> -->
      </div>
      
      <div class="profile-stats">
        <div class="stat-card">
          <h3>{{ followers.length }}</h3>
          <p>Followers</p>
        </div>
        <div class="stat-card">
          <h3>{{ following.length }}</h3>
          <p>Following</p>
        </div>
      </div>

    </div>
  </main>

  <div class="modal-overlay" *ngIf="showEditProfileModal">
    <div class="modal">
      <h3>Edit Profile</h3>
      <input type="text" [(ngModel)]="editName" placeholder="Name" />
      <textarea [(ngModel)]="editBio" placeholder="Bio"></textarea>
      <div class="modal-actions">
        <button (click)="saveProfile()">Save</button>
        <button (click)="showEditProfileModal = false">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showReportUserModal">
    <div class="modal">
      <h3>Report User</h3>
      <textarea [(ngModel)]="reportUserReason" placeholder="Why are you reporting this user?" rows="4"></textarea>
      <div class="modal-actions">
        <button (click)="showReportUserModal = false">Cancel</button>
        <button (click)="submitReportUser()">Submit Report</button>
      </div>
    </div>
  </div>

</div>
