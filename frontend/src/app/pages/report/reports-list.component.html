<div class="container">
  <h2 *ngIf="userId">Reports by User #{{ userId }}</h2>
  <h2 *ngIf="postId">Reports for Post #{{ postId }}</h2>

  <table class="table">
    <thead>
      <tr>
        <th>Report ID</th>
        <th>Reason</th>
        <th>User</th>
        <th>Post</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of reports">
        <td>{{ r.id }}</td>
        <td>{{ r.reason }}</td>
        <td>{{ r.user?.username }}</td>
        <td>{{ r.post?.title }}</td>
        <td>{{ r.date }}</td>
        <td>
          <button (click)="openDetails(r)" class="btn btn-primary">
            View
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
