<div class="auth-container">
  <div class="auth-card split">

    <div class="auth-left">
      <h1>WELCOME</h1>
      <h3>YOUR HEADLINE NAME</h3>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        Sed do eiusmod tempor incididunt ut labore.
      </p>

      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
    </div>

    <div class="auth-right">

      <div class="auth-header">
        <h2>Sign in</h2>
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm">

        <div class="form-group">
          <label for="email">
            <i class="icon">📧</i> Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="credentials.email"
            placeholder="Enter your email"
            required
            email
            #emailInput="ngModel"
            class="form-control"
          />
          <div class="error" *ngIf="emailInput.invalid && emailInput.touched">
            Please enter a valid email
          </div>
        </div>

        <div class="form-group">
          <label for="password">
            <i class="icon">🔒</i> Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="Enter your password"
            required
            minlength="6"
            #passwordInput="ngModel"
            class="form-control"
          />
          <div class="error" *ngIf="passwordInput.invalid && passwordInput.touched">
            Password must be at least 6 characters
          </div>
        </div>

        <div class="forgot-password">
          <a routerLink="/forgot-password">Forgot Password?</a>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!loginForm.valid"
          >
            Sign in
          </button>

          <div class="divider">
            <span>OR</span>
          </div>

          <a routerLink="/register" class="btn-secondary">
            Create account
          </a>
        </div>

        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="alert alert-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>

    </div>
  </div>
</div>
